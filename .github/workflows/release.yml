name: release

# Manual only. Publishes @talking-avatar/formats then @talking-avatar/player
# via npm trusted publishing (GitHub OIDC, workflow release.yml, no environment).
# 0.1.0 was published by hand; this job does not use a registry secret.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      # setup-node writes registry-url into .npmrc as an _authToken line
      # that interpolates a placeholder auth env var. OIDC still works
      # because npm >= 11.5.1 swaps in the GitHub OIDC token at publish
      # time (v4 and v6 share this auth path).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Ensure npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@11.5.1
      - name: Require formats and player versions to match
        run: |
          expected=""
          for pkg in packages/formats packages/player; do
            ver="$(node -p "require('./${pkg}/package.json').version")"
            if [[ ! "$ver" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${pkg} version '${ver}' is not MAJOR.MINOR.PATCH with an optional prerelease."
              exit 1
            fi
            if [[ -z "$expected" ]]; then
              expected="$ver"
            elif [[ "$ver" != "$expected" ]]; then
              echo "::error::${pkg} version ${ver} does not match ${expected}"
              exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish formats then player with provenance
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/npm-tarballs"
          mkdir -p "$dest"
          # pnpm pack rewrites workspace:* to the real version (pnpm workspace
          # protocol). npm publish of the tarball is the OIDC path (npm >= 11.5.1);
          # pnpm 10 still shells publish out to npm and is not relied on here.
          for pkg in packages/formats packages/player; do
            name="$(node -p "require('./${pkg}/package.json').name")"
            ver="$(node -p "require('./${pkg}/package.json').version")"
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "skip ${name}@${ver} (already on npm)"
              continue
            fi
            pkgdest="${dest}/$(basename "${pkg}")"
            mkdir -p "$pkgdest"
            pnpm --filter "./${pkg}" pack --pack-destination "$pkgdest"
            npm publish "$pkgdest"/*.tgz --access public --provenance
          done
